<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pòster de ports i connexions d'un ordinador</title>
<style>
  :root { --bg:#f1ede2; --card:#fbf9f3; --line:#1d1d1b; --txt:#1d1d1b; --mut:#6b675c; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Helvetica Neue", Arial, sans-serif; color:var(--txt); background:var(--bg); min-height:100vh; }
  header { padding:48px 24px 24px; max-width:1400px; margin:0 auto; border-bottom:4px solid var(--line); }
  header .kicker { letter-spacing:.15em; font-size:.8rem; color:var(--mut); text-transform:uppercase; }
  header h1 { font-size:clamp(2rem,6vw,4rem); font-weight:900; margin:8px 0; line-height:1.05; }
  header p { color:var(--mut); max-width:693px; }
  main { max-width:1400px; margin:0 auto; padding:10px 24px 40px; }
  section { margin-top:44px; --a:#2563a8; }
  section h2 {
    display:inline-block; font-size:1.2rem; background:var(--a); color:#fff;
    text-transform:uppercase; letter-spacing:.06em; padding:8px 14px; margin-bottom:8px;
  }
  section .sub { color:var(--mut); font-size:.9rem; margin-bottom:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:18px; }
  .card { background:white; border:2px solid var(--line); padding:12px; }
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .side { text-align:center; }
  .frame { aspect-ratio:4/3; background:#e2dccb; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .frame img { width:100%; height:100%; object-fit:cover; display:block; }
  .frame.empty { border:2px dashed #b3ad9b; color:var(--mut); font-size:.75rem; background:transparent; }
  .role { font-size:.65rem; letter-spacing:.15em; text-transform:uppercase; color:var(--mut); margin-top:8px; }
  .name { font-size:.95rem; font-weight:600; margin-top:2px; }
  @media print { .card { break-inside:avoid; } }
</style>
</head>
<body>
<header>
  <div class="kicker">Guia visual de maquinari</div>
  <h1>Ports i connexions d'un ordinador</h1>
  <p>Cada port amb la seva connexió, agrupats per tipus.</p>
</header>

<main id="poster"></main>

<script src="images/credits.js"></script>
<script>
// [clau d'imatge, nom del port, nom de la connexió]
const groups = [
  { t: 'Ports i connexions de dades', a: '#2563a8', d: 'Transferència de dades i, sovint, càrrega', items: [
    ['usb2a', 'USB 2.0 Tipus A'], ['usb2b', 'USB 2.0 Tipus B'], ['usb3a', 'USB 3.0 Tipus A'], ['usb3b', 'USB 3.0 Tipus B'],
    ['mini', 'Mini-USB'], ['micro', 'Micro-USB'], ['usbc', 'USB Tipus C'], ['lightning', 'Lightning'],
    ['tb2', 'Thunderbolt 2.0'], ['firewire', 'FireWire'],
  ]},
  { t: 'Ports i connexions de vídeo', a: '#c8366b', d: 'Imatge cap a monitors, projectors i televisors', items: [
    ['vga', 'VGA'], ['hdmi', 'HDMI'], ['minihdmi', 'Mini-HDMI'], ['dp', 'DisplayPort'],
    ['minidp', 'Mini-DisplayPort'], ['dvi', 'DVI'], ['svideo', 'S-Video'],
  ]},
  { t: "Ports i connexions d'àudio", a: '#c98a00', d: 'Entrades i sortides de so', items: [
    ['jack635', 'Jack 6,35 mm'], ['minijack', 'Minijack 3,5 mm'], ['subminijack', 'Subminijack 2,5 mm'], ['rca', 'RCA'],
    ['ts', 'TS (mono)'], ['trs', 'TRS (estèreo)'], ['trrs', 'TRRS (estèreo + micro)'], ['trrrs', 'TRRRS'],
  ]},
  { t: 'Ports i connexions de xarxa', a: '#2f8f5b', d: 'Xarxes cablejades i telefonia', items: [
    ['rj45', 'RJ45'], ['lc', 'Fibra òptica (LC duplex)'], ['sc', 'Fibra òptica (SC)'], ['rj11', 'RJ11'],
  ]},
  { t: "Ports i connexions d'alimentació", a: '#d9622b', d: 'Per a cada parella: connector (cable) i port (entrada)', items: [
    ['c5c6', 'C6 (entrada)', 'C5 (connector)'],
    ['c7c8', 'C8 (entrada)', 'C7 (connector)'],
    ['c13c14', 'C14 (entrada)', 'C13 (connector)'], ['c15c16', 'C16 (entrada)', 'C15 (connector)'],
    ['c17c18', 'C18 (entrada)', 'C17 (connector)'],
    ['c19c20', 'C20 (entrada)', 'C19 (connector)'], ['c21c22', 'C22 (entrada)', 'C21 (connector)'],
    ['magsafe', 'Port magnètic', 'Carregador magnètic'],
  ]},
  { t: 'Altres ports comuns', a: '#6a4fb3', d: "Perifèrics, emmagatzematge, ranures d'expansió, memòria i processador", items: [
    ['ps2', 'PS/2'], ['sata', 'SATA'], ['esata', 'eSATA'], ['pci', 'PCI'], ['pcie16', 'PCI Express x16'],
    ['pcie1', 'PCI Express x1'], ['ata', 'ATA / IDE'], ['dimm', 'DIMM (memòria RAM)'],
    ['pga', 'Socket CPU PGA'], ['lga', 'Socket CPU LGA'],
  ]},
];

const has = k => typeof CREDITS !== 'undefined' && k in CREDITS;
const side = (key, role, name) => `
  <div class="side">
    ${has(key) || key === 'usb2a-port' || key === 'usb3a-port' || key === 'usb3b-port' || key === 'micro-port' || key === 'dvi-port' || key === 'minihdmi-port' || key === 'minidp-port' || key === 'svideo-port' || key === 'rj11-port' || key === 'sc-port' || key === 'ts-port' || key === 'trs-port' || key === 'trrs-port' || key === 'trrrs-port' || key === 'trrrs-con' || key === 'subminijack-port' || key === 'c9c10-con' || key === 'c21c22-port' || key === 'magsafe-port' || key === 'c15c16-port' || key === 'c15c16-con' || key === 'pci-con' || key === 'pcie16-con' || key === 'pcie1-con'
      ? `<div class="frame"><img src="images/${key === 'usb2a-port' ? 'usb-a-port.jpg' : key === 'trrrs-con' ? 'trrrs-con.jpg' : key === 'c15c16-port' ? 'c16c15-port.jpg' : `${key}.jpg`}" alt="${name}" loading="lazy"></div>`
      : `<div class="frame empty">Imatge pendent</div>`}
    <div class="role">${role}</div><div class="name">${name}</div>
  </div>`;

document.getElementById('poster').innerHTML = groups.map(g => `
  <section style="--a:${g.a}">
    <h2>${g.t}</h2>
    <div class="sub">${g.d}</div>
    <div class="grid">${g.items.map(([k, pn, cn]) => `
      <article class="card"><div class="pair">
        ${side(k + '-port', 'Port', pn)}
        ${side(k + '-con', 'Connexió', cn || pn)}
      </div></article>`).join('')}
    </div>
  </section>`).join('');

</script>
</body>
</html>
